<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تطبيقات محمد</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 20px;
        }
        header h1 {
            font-size: 28px;
            color: #38bdf8;
            margin-bottom: 10px;
        }
        header p {
            color: #94a3b8;
            font-size: 15px;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        .app-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .app-title {
            font-size: 20px;
            color: #fff5f5;
            margin-bottom: 10px;
        }
        .app-desc {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            background-color: #22c55e;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #16a34a;
        }
        footer {
            margin-top: auto;
            text-align: center;
            color: #64748b;
            font-size: 13px;
            padding: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>منصة تطبيقات محمد 🚀</h1>
        <p>هنا أستعرض أفضل التطبيقات التي قمت بتطويرها</p>
    </header>

    <div class="container" id="appsContainer">
        
        <!-- بطاقة تطبيق الفريمات -->
        <div class="app-card">
            <h2 class="app-title">تطبيق زيادة الفريمات (FPS Booster)</h2>
            <p class="app-desc">أداة احترافية مخصصة لرفع أداء الألعاب وتقليل التشنيع عبر تحسين معالجة الرسوميات وتنظيف الذاكرة.</p>
            
            <!-- رابط التحميل المباشر لجوجل درايف -->
            <a href="https://drive.google.com/uc?export=download&id=1X1g_xZ01m4vNlS7x8Z9jK2l3m4n5p6q7" class="btn" target="_blank">تحميل التطبيق (APK)</a>
        </div>

    </div>

    <footer>
        جميع الحقوق محفوظة © 2026 - تم التطوير بواسطة محمد
    </footer>

</body>
</html>
