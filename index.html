<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تطبيقات محمد - التحديث الجديد</title>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding: 50px 20px;
        }
        h1 {
            color: #00ffcc;
            font-size: 32px;
        }
        .box {
            background: #111;
            border: 2px solid #00ffcc;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            margin: 20px auto;
        }
        .download-btn {
            display: inline-block;
            background-color: #ff0055;
            color: white;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>موقع محمد الرسمي 🚀</h1>
    <p>هذه هي النسخة الجديدة والمحدثة 100%</p>

    <div class="box">
        <h2>تطبيق الفريمات (FPS)</h2>
        <p>اضغط الزر أدناه وسيبدأ تنزيل الملف فوراً على جهازك:</p>
        <a id="dlBtn" class="download-btn">تحميل الـ APK الآن</a>
    </div>

    <script>
        document.getElementById('dlBtn').onclick = function() {
            const blob = new Blob(["PK\x03\x04模擬 APK"], { type: 'application/vnd.android.package-archive' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'mohamed-app.apk';
            document.body.appendChild(a);
            a.click();
            URL.revokeObjectURL(url);
        };
    </script>

</body>
</html>
